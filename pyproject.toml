[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emvro"
version = "0.1.0"
description = "EMV route optimization data pipeline and depot inference for ASI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "shapely>=2.0",
  "pyproj>=3.6",
  "tqdm>=4.66",
  "networkx>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
