[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emvro"
version = "0.1.0"
description = "London Fire Brigade station placement with a learned travel-time model (ASI)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyproj>=3.6",
  "networkx>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
